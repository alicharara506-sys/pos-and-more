name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.0'

jobs:
  lint-typecheck-unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @salesmaster/database generate

      - name: Build shared packages
        run: |
          pnpm --filter @salesmaster/domain build
          pnpm --filter @salesmaster/database build
          pnpm --filter @salesmaster/contracts build
          pnpm --filter @salesmaster/config build
          pnpm --filter @salesmaster/offline-sync build

      - name: Format check
        run: pnpm format:check

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

  migration-check:
    name: Migration verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: salesmaster
          POSTGRES_PASSWORD: salesmaster
          POSTGRES_DB: salesmaster
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to a clean database
        run: pnpm --filter @salesmaster/database exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://salesmaster:salesmaster@localhost:5432/salesmaster
          DIRECT_URL: postgresql://salesmaster:salesmaster@localhost:5432/salesmaster

      - name: Seed platform configuration
        run: pnpm --filter @salesmaster/database seed
        env:
          DATABASE_URL: postgresql://salesmaster:salesmaster@localhost:5432/salesmaster

  integration-tests:
    name: API integration tests
    runs-on: ubuntu-latest
    needs: migration-check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: salesmaster
          POSTGRES_PASSWORD: salesmaster
          POSTGRES_DB: salesmaster
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://salesmaster:salesmaster@localhost:5432/salesmaster
      DIRECT_URL: postgresql://salesmaster:salesmaster@localhost:5432/salesmaster
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
      AUTH_JWT_SECRET: ci-test-secret-please-change-1234567890
      AUTH_ENCRYPTION_KEY: ci-test-encryption-key-please-change-098
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @salesmaster/domain build
          pnpm --filter @salesmaster/database build
          pnpm --filter @salesmaster/contracts build
          pnpm --filter @salesmaster/config build
          pnpm --filter @salesmaster/offline-sync build

      - name: Apply migrations
        run: pnpm --filter @salesmaster/database exec prisma migrate deploy

      - name: Seed platform configuration
        run: pnpm --filter @salesmaster/database seed

      - name: Run API integration tests
        run: pnpm --filter @salesmaster/api test:integration

  build:
    name: Build all apps
    runs-on: ubuntu-latest
    needs: [lint-typecheck-unit]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @salesmaster/database generate

      - name: Build shared packages
        run: |
          pnpm --filter @salesmaster/domain build
          pnpm --filter @salesmaster/database build
          pnpm --filter @salesmaster/contracts build
          pnpm --filter @salesmaster/config build
          pnpm --filter @salesmaster/offline-sync build

      - name: Build API
        run: pnpm --filter @salesmaster/api build

      - name: Build web
        run: pnpm --filter @salesmaster/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

      - name: Build worker
        run: pnpm --filter @salesmaster/worker build
